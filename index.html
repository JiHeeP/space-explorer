<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>우주 탐험대 — 블록 코딩</title>
<style>
:root{--bg:#080e20;--panel:#121b36;--panel2:#0c142b;--line:#2b3a68;--ink:#eaf0ff;--sub:#9fadd0;--cy:#5ee6ff;--gold:#ffd66b;--bad:#ff6b78;--ok:#5fe3a1;--pink:#ff8ad8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.5}
body{background:radial-gradient(1200px 500px at 80% -10%,#1a2a5c 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#2a1650 0,transparent 55%),var(--bg);min-height:100vh}
button{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:#19244a;color:var(--ink);border-radius:10px;padding:7px 13px;font-weight:700}
button:hover:not(:disabled){border-color:var(--cy)}
button:disabled{opacity:.38;cursor:default}
button.primary{background:var(--cy);color:#04202a;border-color:var(--cy)}
button.primary:hover:not(:disabled){background:#9af1ff}
button.soft{background:transparent;font-weight:600;color:var(--sub)}
header{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1.5px solid var(--line);background:rgba(8,14,32,.8)}
header h1{font-size:19px;margin:0;letter-spacing:.5px}
header h1 b{color:var(--cy)}
header .sp{flex:1}
.tag{font-size:13px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--sub)}
main{padding:12px 18px 40px;max-width:1400px;margin:0 auto;user-select:none;-webkit-user-select:none}
main input{user-select:text;-webkit-user-select:text}
h2{margin:0;font-size:22px;letter-spacing:-.3px}
.muted{color:var(--sub)}.small{font-size:13px}

/* 첫 화면 */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:center;margin:10px 0 18px}
.eyebrow{color:var(--cy);font-weight:800;letter-spacing:3px;font-size:12px}
.hero h2{font-size:36px;line-height:1.2;margin-top:6px}
.hero h2 span{color:var(--gold)}
.hero p{margin:10px 0 0;font-size:17px;color:var(--sub)}
.startbox{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.startbox input{font:inherit;font-weight:700;width:76px;padding:7px 9px;border:1.5px solid var(--line);border-radius:10px;background:#0a1227;color:var(--ink)}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:11px}
.panel h3{margin:0 0 8px;font-size:13px;color:var(--sub);letter-spacing:.5px;font-weight:700}
.route{display:grid;gap:6px}
.route div{display:flex;gap:9px;align-items:center;font-weight:700;font-size:14px}
.route b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#0a1227;border:1.5px solid var(--cy);color:var(--cy);font-size:12px}

.zone{margin-top:16px}
.zone h3{margin:0 0 8px;font-size:15px;display:flex;gap:9px;align-items:center}
.zone h3 b{background:var(--cy);color:#04202a;border-radius:7px;padding:1px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.mcard{text-align:left;padding:10px 12px;border-radius:13px;display:block;width:100%;font-weight:600;min-height:82px;background:var(--panel)}
.mcard .n{font-size:12px;color:var(--cy);font-weight:800;letter-spacing:.5px}
.mcard strong{display:block;font-size:16.5px;margin:1px 0 3px}
.mcard small{color:var(--sub)}
.mcard.done{border-color:var(--ok)}
.mcard.done small{color:var(--ok);font-weight:700}
.mcard.locked{opacity:.4;border-style:dashed}

/* 미션 화면 */
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ghead .sp{flex:1}
.goal{background:linear-gradient(90deg,#14224a,#101a38);border:1.5px solid var(--cy);border-radius:13px;padding:8px 14px;margin-bottom:10px;font-size:17px;font-weight:700;display:flex;gap:14px;align-items:center}
.goal>div:first-child{flex:1}
.goal small{display:block;font-weight:500;color:var(--sub);font-size:14px;margin-top:2px}
.layout{display:grid;grid-template-columns:350px 282px minmax(320px,1fr);gap:12px;align-items:start}
canvas#cv{width:100%;aspect-ratio:1;display:block;border:1.5px solid var(--line);border-radius:11px;background:#050a18}
.vars{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.var{border:1.5px solid var(--line);border-radius:9px;padding:3px 10px;background:var(--panel2);font-weight:700;font-size:14px}
.var b{display:inline-block;min-width:26px;text-align:center;background:var(--gold);color:#2a2000;border-radius:5px;margin-left:5px;padding:0 5px}
.var.cond b{background:#4c66e8;color:#fff}
.var{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.var.cond{flex:1 1 100%;white-space:normal}
.var.cond b{white-space:normal;text-align:left;padding:1px 8px}
.status{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--panel2);border:1.5px solid var(--line);font-size:15px;min-height:46px}
.status.bad{border-color:var(--bad);background:#2a1422}
.status.ok{border-color:var(--ok);background:#0f2a25}
.askbox{margin-top:8px;padding:10px 11px;border-radius:10px;border:2px solid var(--pink);background:#2a1436;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.askbox input{font:inherit;font-weight:700;width:90px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:#111}
.examples{display:flex;gap:8px}
.ex{border:1.5px dashed var(--line);border-radius:10px;padding:6px;background:var(--panel2);text-align:center;font-size:12px;font-weight:700;width:124px;line-height:1.3;white-space:nowrap}
.ex canvas{width:50px;height:50px;display:block;margin:0 auto}
.runbar{display:flex;gap:7px;margin-top:8px}
.runbar button{flex:1;white-space:nowrap;padding:7px 6px}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}

/* 블록 */
.blk{--c:#888;color:#fff;font-weight:700;font-size:15px;margin:4px 0;width:max-content;max-width:100%;border-radius:9px;user-select:none;-webkit-user-select:none}
.blk.move{--c:#a14fdc}.blk.flow{--c:#1497c2}.blk.data{--c:#cf3fca}.blk.look{--c:#e23f60}
.bh{background:var(--c);border-radius:9px;padding:7px 10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;cursor:grab;touch-action:none;position:relative}
.cblk{background:var(--c);min-width:250px}
.cblk>.list{margin-left:16px;background:#0b1330;border-radius:7px 0 0 7px;min-height:42px;padding:3px 7px}
#ws .cblk>.list:empty::before{content:"여기에 블록 넣기";display:block;color:#7f8db8;font-weight:500;font-size:13px;padding:8px 4px}
.bm{padding:4px 10px}.bf{height:11px}
.blk.on>.bh{outline:4px solid var(--gold);outline-offset:1px}
.blk .del{border:0;background:rgba(0,0,0,.25);color:#fff;border-radius:999px;width:20px;height:20px;padding:0;line-height:18px;font-size:13px;margin-left:5px}
.blk .del:hover{background:rgba(0,0,0,.55)!important}
.slot{display:inline-flex;align-items:center}
.slot.num,.slot.txt{background:#fff;color:#141a2e;border-radius:999px;min-width:34px;padding:1px 9px;justify-content:center;cursor:text;border:2px solid transparent}
.slot.txt{border-radius:6px}
.slot.hot.num,.slot.hot>.rep{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.rep{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.75);cursor:pointer}
.r-ans,.r-var{background:#cf3fca}.r-calc{background:#e9a50c;color:#2a2000}
.cond{display:inline-flex;align-items:center;gap:4px;background:#4c66e8;border:2px solid rgba(255,255,255,.7);border-radius:7px;padding:2px 6px}
.blk select,.rep select{font:inherit;font-weight:700;border-radius:6px;border:0;padding:1px 2px;background:#fff;color:#141a2e}
.op{background:#fff;color:#141a2e;border-radius:6px;padding:0 6px}
input.edit{font:inherit;font-weight:700;width:64px;border:0;outline:0;text-align:center;background:transparent;color:#141a2e}
.slot.txt input.edit{width:130px}
.panel.pal{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow-y:auto}
.pal .blk,.pal .rep{cursor:grab;touch-action:none}
.pal .rep{margin:3px 4px 3px 0}
.pal h4{margin:7px 0 2px;font-size:12px;color:var(--sub)}
.pal h4:first-child{margin-top:0}
.pal .blk .slot,.pal .blk select{pointer-events:none}
.pal .cblk{min-width:0}
.pal .blk{font-size:13px;margin:3px 0}
.pal .bh{flex-wrap:nowrap;white-space:nowrap;padding:5px 8px;gap:4px}
.pal .cblk>.list{min-height:12px;padding:0}
.pal .bm{padding:2px 8px}.pal .bf{height:7px}
.pal .slot.num,.pal .slot.txt{min-width:28px;padding:0 7px}
#ws{min-height:330px;padding-bottom:50px}
.hat{background:#17a85a;color:#fff;font-weight:700;font-size:15px;border-radius:14px 14px 9px 9px;padding:7px 12px;width:max-content}
.list.root{min-height:80px}
.marker{height:6px;border-radius:3px;background:var(--gold);margin:3px 0;width:180px;box-shadow:0 0 10px var(--gold)}
.dghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;transform:rotate(-1.5deg)}
.empty{color:var(--sub);font-weight:500;font-size:14px;padding:10px 4px}
.code-ro{background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;margin:8px 0;overflow:auto}
.code-ro .bh{cursor:default}

/* 병기(번역) — 한국어 아래 작은 글씨 */
.tr{display:block;font-weight:500;line-height:1.35;margin-top:2px;opacity:.92}
.tr[lang=zh],.tri[lang=zh],.ptr[lang=zh]{font-size:.85em}
.tr[lang=ru],.tri[lang=ru],.ptr[lang=ru]{font-size:.8em}
.tri{font-weight:500;margin-left:6px;opacity:.9}
h2 .tr{font-size:.6em!important;margin-top:4px}
.hero h2 .tr{font-size:.5em!important;line-height:1.3}
.goal .tr{font-weight:600}
.ptr{font-weight:500;color:var(--ink);opacity:.85;margin:-1px 0 5px 3px;line-height:1.25}
button .tr{margin-top:0}
.runbar button{line-height:1.25}
.route .rt{font-weight:700}.route .rd{color:var(--sub);font-weight:500}
.zone h3{flex-wrap:wrap}
body[data-lang=zh] #ws .cblk>.list:empty::before{content:"여기에 블록 넣기 · 把积木放这里"}
body[data-lang=ru] #ws .cblk>.list:empty::before{content:"여기에 블록 넣기 · Положи блок сюда"}
.langpick{max-width:860px;margin:6vh auto 0;text-align:center}
.langpick h2{font-size:30px;margin:8px 0 22px}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.langs button{padding:26px 10px;border-radius:16px;background:var(--panel)}
.langs button b{display:block;font-size:23px}
.langs button span{display:block;color:var(--sub);font-weight:500;margin-top:6px}
.langs button.sel{border-color:var(--cy);box-shadow:0 0 22px rgba(94,230,255,.3)}
.ex{white-space:normal!important;width:auto!important;min-width:118px}
.askbox>span:first-child{flex:1;min-width:150px}
#cert .tr{color:#1a2036;opacity:1}
#cert h2 .tr{letter-spacing:2px;font-size:.36em!important}

/* 배지 · 수료증 */
.badgebox{display:flex;gap:18px;align-items:center;margin:10px 0 4px;padding:10px 14px;border-radius:13px;background:var(--panel2);border:1.5px solid var(--line)}
.badgebox .bt{font-weight:800;font-size:18px}
.badgebox .bt small{display:block;font-weight:600;color:var(--sub);font-size:14px}
.sparks{position:relative;flex:none}
.pop{display:block;animation:pop .9s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 16px rgba(255,214,107,.55))}
@keyframes pop{0%{transform:scale(0) rotate(-200deg);opacity:0}70%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.sparks i{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3px;border-radius:50%;background:var(--gold);animation:fly 1s .35s ease-out both}
@keyframes fly{0%{transform:rotate(var(--a)) translateX(10px);opacity:1}100%{transform:rotate(var(--a)) translateX(86px);opacity:0}}
.medal{margin-top:8px;padding:9px 14px;border-radius:13px;border:1.5px solid var(--gold);background:#2a2410;font-weight:800;color:var(--gold);display:flex;gap:12px;align-items:center}
.strip{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.strip svg{display:block}
.chars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}
.chars button{font-size:44px;padding:12px 0;line-height:1.1}
.chars button.sel{border-color:var(--gold);background:#2a2410;box-shadow:0 0 18px rgba(255,214,107,.4)}
#cert{max-width:820px;margin:0 auto;background:#fffdf5;color:#1a2036;border:4px double #1a2036;border-radius:6px;padding:30px 44px 26px;text-align:center;box-shadow:0 0 60px rgba(94,230,255,.2)}
#cert .ct{letter-spacing:10px;font-size:15px;font-weight:800;color:#51608c}
#cert h2{font-size:44px;letter-spacing:14px;margin:4px 0 6px;color:#1a2036}
#cert .ch{font-size:84px;line-height:1.15}
#cert .who{font-size:26px;font-weight:800;margin-top:2px}
#cert .nm{margin:10px auto 0;font-size:18px;font-weight:700}
#cert .nm span{display:inline-block;width:220px;border-bottom:2px solid #1a2036;height:26px;vertical-align:bottom}
#cert p{font-size:18px;line-height:1.85;margin:16px auto 10px;max-width:620px}
#cert .skills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
#cert .skills b{border:2px solid #1a2036;border-radius:999px;padding:2px 14px;font-size:15px}
#cert .strip{justify-content:center}
#cert .ft{display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px;font-weight:700}
#cert .ft div:last-child{font-size:20px;letter-spacing:4px}
.blk.bad>.bh{outline:4px solid var(--bad);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.pop,.sparks i{animation:none}}
@media print{body{background:#fff!important}header,.noprint{display:none!important}main{padding:0;max-width:none}#cert{box-shadow:none;margin-top:10mm}}

/* 모달 */
dialog{border:1.5px solid var(--cy);border-radius:16px;padding:20px 22px;max-width:660px;width:calc(100% - 30px);background:#0f1833;color:var(--ink);box-shadow:0 0 60px rgba(94,230,255,.18)}
dialog::backdrop{background:rgba(3,6,16,.72)}
dialog h2{margin-bottom:8px}
.mact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{padding:8px;text-align:center;font-weight:700;min-height:60px}
.opt canvas{width:100%;aspect-ratio:1;display:block}
.opt.right{border-color:var(--ok);background:#0f2a25}
.opt.wrong{border-color:var(--bad);background:#2a1422}
.frame{border:1.5px solid var(--gold);border-radius:11px;padding:10px 12px;background:var(--panel2);margin-top:12px;font-weight:700;line-height:2.2}
.frame select{font:inherit;font-weight:700;border:1.5px solid var(--gold);border-radius:6px;padding:1px 4px;background:#fff7d6;color:#141a2e}
.frame select.bad{border-color:var(--bad);background:#ffd9dd}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tf div{border-radius:10px;padding:8px 10px;font-weight:700;border:1.5px solid var(--line);background:var(--panel2)}
.tf .t b{color:var(--ok)}.tf .f b{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1.5px solid var(--line);padding:5px 8px;text-align:left}
th{background:#19244a}
.quiz{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qrow{background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:8px;font-weight:700;font-size:17px}
.qrow small{display:block;color:var(--sub);font-weight:500;font-size:13px}
.qrow input,.qrow select{font:inherit;font-weight:700;width:86px;padding:4px 7px;border:1.5px solid var(--gold);border-radius:7px;background:#fff7d6;color:#141a2e;text-align:center}
.qrow select{width:auto}
.qrow .bad{border-color:var(--bad);background:#ffd9dd}
.qrow .good{border-color:var(--ok);background:#d6ffe9}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shapes div{border:1.5px solid var(--line);border-radius:11px;background:var(--panel2);padding:6px;text-align:center;font-weight:700;font-size:14px}
.shapes canvas{width:100%;aspect-ratio:1}
.entry .blk{margin:3px 0}
.entry .hatb{--c:#17a85a}.entry .pen{--c:#f08a00}
@media(max-width:1050px){.layout{grid-template-columns:1fr 1fr}.layout>.stage{grid-column:1/-1}.hero{grid-template-columns:1fr}.quiz{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>◈ <b>우주 탐험대</b></h1><span class="tag">블록 코딩 · 순차 · 반복 · 선택 · 변수 · 계산</span>
  <span class="sp"></span><span id="pilotTag" class="tag"></span>
  <button class="soft" id="langBtn" onclick="langScreen()">🌐</button><button class="soft" id="helpBtn" onclick="help()">도움말</button>
</header>
<main id="app"></main>
<dialog id="modal"></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VARNAME='변의 수';
let uid=0;

/* ───────── 블록 정의 ───────── */
const DEF={
 step:{cat:'move',parts:['앞으로 1칸 가기'],args:{}},
 move:{cat:'move',parts:['이동 방향으로 ',['n'],' 만큼 움직이기'],args:{n:100}},
 right:{cat:'move',parts:['오른쪽으로 ',['a'],'° 돌기'],args:{a:90}},
 left:{cat:'move',parts:['왼쪽으로 ',['a'],'° 돌기'],args:{a:90}},
 repeat:{cat:'flow',parts:[['n'],' 번 반복하기'],args:{n:4},c:1},
 if:{cat:'flow',parts:['만일 ',['cond','c'],' (이)라면'],args:{cond:{a:0,op:'>',b:10}},c:1},
 ifelse:{cat:'flow',parts:['만일 ',['cond','c'],' (이)라면'],args:{cond:{a:0,op:'>',b:10}},c:2},
 ask:{cat:'data',parts:[['text','t'],' 을(를) 묻고 대답 기다리기'],args:{text:'몇이야?'}},
 setvar:{cat:'data',parts:[VARNAME+' 를 ',['v'],' (으)로 정하기'],args:{v:4}},
 say:{cat:'look',parts:[['text','t'],' 을(를) 말하기'],args:{text:'안녕!'}}
};
const B=(t,args,body,els)=>{const b={id:++uid,t,args};if(body)b.body=body;if(els)b.els=els;return b};
const defArgs=t=>{const a=clone(DEF[t].args),z=typeof M!=='undefined'&&M[mi];if(z&&t==='ask'&&z.askT)a.text=z.askT;if(z&&t==='say'&&z.sayT)a.text=z.sayT;return a};
const make=t=>B(t,defArgs(t),DEF[t].c?[]:undefined,DEF[t].c===2?[]:undefined);
const ANS={v:'ans'},VAR={v:'var'},CALC=(a,b,op='÷')=>({v:'calc',a,op,b});
const sp=()=>B('step',{}),mv=n=>B('move',{n}),rt=a=>B('right',{a}),lt=a=>B('left',{a}),rep=(n,body)=>B('repeat',{n},body),ask=text=>B('ask',{text}),say=text=>B('say',{text}),setv=v=>B('setvar',{v});
const iff=(a,op,b,body)=>B('if',{cond:{a,op,b}},body),ife=(a,op,b,body,els)=>B('ifelse',{cond:{a,op,b}},body,els);
const poly=(n,len)=>[rep(n,[mv(len),rt(360/n)])];
const gate=()=>[ask('에너지가 얼마야?'),ife(ANS,'>',10,[mv(200)],[say('에너지가 모자라요')])];

['「앞으로 1칸 가기」 블록을 끌어서 오른쪽 조립소에 놓아. 기지까지 몇 칸인지 세어 봐. 다 놓았으면 ▶ 실행을 눌러.','把「前进1格」积木拖到右边的组装区。数一数到基地有几格。放好后点 ▶ 运行。','Перетащи блок «вперёд на 1 клетку» в сборку справа. Посчитай, сколько клеток до базы. Когда всё готово, нажми ▶ Пуск.'],
['먼 기지','遥远的基地','Далёкая база'],['기지가 멀어. 블록은 3개까지만 쓸 수 있어.','基地很远。最多只能用3个积木。','База далеко. Можно использовать не больше 3 блоков.'],
['「앞으로 n칸」 블록은 없어. 반복하기의 숫자를 6으로 바꾸고, 그 안에 「앞으로 1칸 가기」를 넣으면 6칸을 가.','没有「前进n格」积木。把重复积木的数字改成6，再把「前进1格」放进去，就能走6格。','Блока «вперёд на n клеток» нет. Поменяй число в блоке повторения на 6 и положи внутрь «вперёд на 1 клетку» — корабль пролетит 6 клеток.'],
['오른쪽으로 돌기','向右转','Поворот направо'],['가다가 오른쪽으로 돌아야 해. 레이저에 닿기 전에 돌아.','走到一半要向右转。碰到激光之前转弯。','По пути нужно повернуть направо. Поверни, пока не задел лазер.'],
['돌기 블록은 제자리에서 방향만 바꿔. 노란색 표시가 얼마나 돌았는지 보여 줘. 90°는 옆으로 한 번 도는 거야.','转弯积木只在原地改变方向。黄色标记表示转了多少。90°就是向旁边转一次。','Блок поворота меняет только направление, корабль остаётся на месте. Жёлтая метка показывает, на сколько он повернул. 90° — это один поворот вбок.'],
['왼쪽, 오른쪽','左转，右转','Налево, направо'],['이번에는 왼쪽으로 한 번, 오른쪽으로 한 번 돌아야 해.','这次要向左转一次，再向右转一次。','Теперь нужно один раз повернуть налево и один раз направо.'],
['왼쪽·오른쪽은 우주선이 보는 쪽에서 정해. 우주선의 뾰족한 쪽이 앞이야.','左和右要从飞船面对的方向来看。飞船尖尖的一头是前面。','«Налево» и «направо» считаются от того, куда смотрит корабль. Острый конец корабля — это перёд.'],
['뒤로 도망쳐','向后逃跑','Беги назад'],['적이 바로 앞에 있어! 뒤로 돌아서 기지로 도망쳐.','敌人就在前面！向后转，逃回基地。','Враг прямо впереди! Развернись и лети на базу.'],
['돌기 블록의 숫자를 눌러서 바꿔 봐. 90°는 옆, 180°는 뒤야.','点击转弯积木里的数字来修改。90°是旁边，180°是后面。','Нажми на число в блоке поворота и измени его. 90° — вбок, 180° — назад.'],
['오른쪽으로 180° 돌면 우주선은 어디를 볼까?','向右转180°后，飞船会朝向哪里？','Куда будет смотреть корабль, если повернуть направо на 180°?'],
['오른쪽 옆','右边','вправо (вбок)'],['뒤','后面','назад'],['그대로 앞','还是前面','по-прежнему вперёд'],
['90°가 옆이니까, 90° + 90° = 180°는 뒤야.','90°是旁边，所以 90° + 90° = 180° 就是后面。','90° — это вбок, значит 90° + 90° = 180° — это назад.'],
['대각선으로 빠져나가기','斜着穿过去','Наискосок'],['레이저 사이를 대각선으로 지나가.','从激光之间斜着穿过去。','Пролети между лазерами наискосок.'],
['90°의 절반만 돌면 대각선 방향이 돼. 90의 절반은 얼마일까?','只转90°的一半，就是斜的方向。90的一半是多少？','Если повернуть на половину от 90°, корабль полетит наискосок. Сколько будет половина от 90?'],
['계단 레이저','楼梯激光','Лазерная лестница'],['계단 모양 길이야. 블록은 6개까지만 쓸 수 있어.','这条路像楼梯一样拐弯。最多只能用6个积木。','Путь идёт ступеньками. Можно использовать не больше 6 блоков.'],
['똑같이 반복되는 부분을 찾아. 「가기 → 돌기 → 가기 → 돌기」가 몇 번 나오지?','找出重复出现的一组动作。「前进 → 转弯 → 前进 → 转弯」出现了几次？','Найди группу, которая повторяется. Сколько раз встречается «вперёд → поворот → вперёд → поворот»?'],
['고장 난 길','出故障的路线','Сломанный маршрут'],['고장 난 코드야! 이대로 가면 레이저에 맞아. 숫자 하나만 고쳐 봐.','这段代码坏了！这样走会被激光打中。只改一个数字。','Код сломан! Так корабль попадёт под лазер. Исправь только одно число.'],
['「한 블록씩」으로 실행해서 어디서 맞는지 봐. 돌기 전에 몇 칸을 가야 할까?','用「单步」运行，看看在哪里被打中。拐弯前要走几格？','Запусти «по шагам» и посмотри, где корабль попадает под лазер. Сколько клеток нужно пролететь до поворота?'],
['「앞으로 1칸 가기」를 □번 반복하면 6칸을 간다. 옆으로 돌려면 □°, 뒤로 돌려면 □° 돈다.','把「前进1格」重复□次，就走6格。向旁边拐要转□°，向后转要转□°。','Если повторить «вперёд на 1 клетку» □ раз, корабль пролетит 6 клеток. Чтобы повернуть вбок, нужно □°, чтобы развернуться назад — □°.'],
/* 미션 9~11 */
['네모 방어막','正方形护盾','Квадратный щит'],['기지를 지키는 네모 방어막(벽)을 만들어. 점선을 따라 그려. 한 변의 길이는 100이야.','做一个保护基地的正方形护盾（墙）。沿着虚线画。每条边长100。','Построй квадратный щит (стену) для защиты базы. Рисуй по пунктиру. Длина стороны — 100.'],
['이제 칸이 없는 우주야. 숫자만큼 움직이고, 지나간 자리에 선(방어막)이 생겨. 「움직이기 → 돌기」를 몇 번 하면 네모가 될까?','现在是没有格子的宇宙。按数字移动，经过的地方会出现护盾。「移动 → 转弯」做几次才是正方形？','Теперь в космосе нет клеток. Корабль летит на заданное число, и за ним остаётся щит. Сколько раз нужно сделать «двигаться → повернуть», чтобы получился квадрат?'],
['360의 비밀','360的秘密','Секрет 360'],['방어막을 다 그리면 우주선은 처음 방향으로 돌아와. 한 바퀴를 돈 거야.','画完护盾后，飞船回到了开始的方向。它转了一整圈。','Когда щит готов, корабль снова смотрит туда же, куда в начале. Он сделал полный оборот.'],
['한 바퀴는 360°야. 네모를 그릴 때 돈 각도를 모두 더해 봐.','一整圈是360°。把画正方形时转过的角度全部加起来。','Полный оборот — 360°. Сложи все углы, на которые корабль повернул, рисуя квадрат.'],
['세모 방어막','三角形护盾','Треугольный щит'],['세모 방어막을 만들어. 점선을 따라 그려. 한 변의 길이는 100이야.','建一个三角形护盾。沿着虚线画。每条边长100。','Построй треугольный щит. Рисуй по пунктиру. Сторона — 100.'],
['방금 찾았지? 세모는 3번 돌아서 한 바퀴(360°)야. 3 × ? = 360.','刚才找到了吧？三角形转3次是一整圈（360°）。3 × ? = 360。','Ты только что это нашёл: треугольник — это 3 поворота на полный оборот (360°). 3 × ? = 360.'],
['이 코드를 실행하면 어떤 그림이 될까?','运行这段代码会画出什么图形？','Что нарисует этот код?'],
['90°씩 3번 돌면 네모의 세 변만 그려져. 세모는 한 번에 더 많이 돌아야 해.','每次转90°转3次，只能画出正方形的三条边。三角形每次要转得更多。','Три поворота по 90° дают только три стороны квадрата. Для треугольника нужно поворачивать сильнее.'],
['오른쪽으로 □° 돌기를 □번 반복하면 네모, □° 돌기를 □번 반복하면 세모가 된다.','向右转□°重复□次是正方形，转□°重复□次是三角形。','Поворот направо на □°, повторённый □ раза, даёт квадрат; поворот на □°, повторённый □ раза, даёт треугольник.'],
/* 미션 12~16 */
['연료만큼 날기','按燃料飞行','Лети по топливу'],['우주선이 연료가 얼마인지 묻고, 대답한 숫자만큼 날아가게 해 봐.','让飞船先问有多少燃料，再飞行回答的数字那么远。','Сделай так, чтобы корабль спросил, сколько топлива, и пролетел столько, сколько ответили.'],
['실행하면 우주선이 물어. 네가 숫자로 대답해. 「대답」 블록을 움직이기의 흰 숫자 칸 위에 놓으면, 대답한 숫자가 그 칸에 들어가.','运行后飞船会提问，你用数字回答。把「回答」积木放到移动积木的白色数字格上，回答的数字就会进到那个格子里。','После запуска корабль спросит, а ты ответишь числом. Положи блок «ответ» на белое поле с числом в блоке движения — туда попадёт число, которое ты ответил.'],
['에너지 문','能量门','Энергетические ворота'],['기지로 들어가는 문이야. 우주선이 에너지를 물으면 네가 숫자로 대답해. 대답이 10보다 크면 문을 지나가(200만큼 움직이기). 아니면 가만히 있어.','这是进入基地的大门。飞船问能量时，你用数字回答。回答大于10就通过大门（移动200）。否则不动。','Это ворота на базу. Корабль спросит про энергию, а ты ответишь числом. Если ответ больше 10, пролети через ворота (двигаться на 200). Иначе стой на месте.'],
[TF+'「15 > 10」은 참, 「5 > 10」은 거짓. 참일 때만 「만일」 안의 블록이 실행돼. 왼쪽 칸에 「대답」을 끌어 넣어.','<b>참（真）</b>的意思是「对」，<b>거짓（假）</b>的意思是「不对（错）」。「15 > 10」是真，「5 > 10」是假。只有为真时，「만일（如果）」里面的积木才会运行。把「回答」拖进左边的格子。','<b>참 (истина)</b> значит «верно», <b>거짓 (ложь)</b> значит «неверно». «15 > 10» — истина, «5 > 10» — ложь. Блоки внутри «만일 (если)» выполняются, только когда условие истинно. Перетащи «ответ» в левое поле.'],
['대답이 15라면, 「15 > 10」은?','如果回答是15，「15 > 10」是？','Если ответ 15, то «15 > 10» — это?'],
['참 — 맞는 말이다','真——说得对','истина — это верно'],['거짓 — 틀린 말이다','假——说得不对','ложь — это неверно'],
['15는 10보다 커. 맞는 말이니까 참이야. 참이면 「만일」 안의 블록이 실행돼.','15比10大。说得对，所以是真。为真时，「如果」里面的积木会运行。','15 больше 10. Это верно, значит истина. Когда истина, выполняются блоки внутри «если».'],
['에너지가 모자라요','能量不够','Не хватает энергии'],['대답이 10보다 크면 문을 지나가(200만큼 움직이기). 아니면 「에너지가 모자라요」라고 말해.','回答大于10就通过大门（移动200）。否则说「에너지가 모자라요（能量不够）」。','Если ответ больше 10, пролети через ворота (двигаться на 200). Иначе скажи «에너지가 모자라요 (не хватает энергии)».'],
['「만일 ~ 아니면」은 칸이 두 개야. 참(맞다)이면 위 칸, 거짓(아니다)이면 「아니면」 아래 칸이 실행돼. 말하기 블록은 아래 칸에 넣어.','「如果…否则」有两个格子。为真（对）时运行上面的格子，为假（不对）时运行「否则」下面的格子。把说话积木放进下面的格子。','У блока «если … иначе» два отсека. Если истина (верно) — выполняется верхний, если ложь (неверно) — нижний, под «иначе». Блок «сказать» положи в нижний отсек.'],
['대답이 5라면 우주선은 무엇을 할까?','如果回答是5，飞船会做什么？','Что сделает корабль, если ответ 5?'],
['문을 지나간다','通过大门','пролетит через ворота'],['「에너지가 모자라요」라고 말한다','说「能量不够」','скажет «не хватает энергии»'],['아무 일도 없다','什么也不做','ничего не произойдёт'],
['「5 > 10」은 틀린 말, 곧 거짓이야. 거짓이면 「아니면」 아래 칸이 실행돼.','「5 > 10」说得不对，也就是假。为假时运行「否则」下面的格子。','«5 > 10» — неверно, то есть ложь. Когда ложь, выполняется отсек под «иначе».'],
['방어막 고르기','选择护盾','Выбери щит'],['우주선이 변이 몇 개인지 물어. 대답이 4이면 네모 방어막, 아니면 세모 방어막을 만들어. 한 변의 길이는 100이야.','飞船会问有几条边。回答是4就做正方形护盾，否则做三角形护盾。每条边长100。','Корабль спросит, сколько сторон. Если ответ 4 — построй квадратный щит, иначе — треугольный. Длина стороны — 100.'],
['가운데 기호 > 를 눌러서 = 로 바꿔 봐. 「대답 = 4」가 참이면 위 칸(네모), 거짓이면 아래 칸(세모)이야.','点击中间的符号 > ，改成 = 。「回答 = 4」为真时运行上面的格子（正方形），为假时运行下面的格子（三角形）。','Нажми на знак > посередине и поменяй его на = . Если «ответ = 4» — истина, выполняется верхний отсек (квадрат), если ложь — нижний (треугольник).'],
['고장 난 문','出故障的门','Сломанные ворота'],['고장 난 코드야! 대답이 10보다 클 때 문을 지나가야 하는데, 반대로 10보다 작을 때 지나가. 한 곳만 고쳐 봐.','这段代码坏了！回答大于10时应该通过大门，现在却是小于10时通过。只改一个地方。','Код сломан! Корабль должен пролетать, когда ответ больше 10, а пролетает, когда меньше 10. Исправь только одно место.'],
['「한 블록씩」을 누르고 15를 넣어 봐. 「15 < 10」은 참일까, 거짓일까?','点击「单步」并输入15。「15 < 10」是真还是假？','Нажми «по шагам» и введи 15. «15 < 10» — это истина или ложь?'],
['「15 > 10」은 맞는 말이라서 □이다. 「5 > 10」은 틀린 말이라서 □이다. 거짓이면 「□」 아래 칸이 실행된다.','「15 > 10」说得对，所以是□。「5 > 10」说得不对，所以是□。为假时运行「□」下面的格子。','«15 > 10» — верно, поэтому это □. «5 > 10» — неверно, поэтому это □. Когда ложь, выполняется отсек под «□».'],
['참','真','истина'],['거짓','假','ложь'],['아니면','否则','иначе'],['만일','如果','если'],['반복','重复','повтор'],
/* 미션 17~22 */
['변수 상자','变量盒子','Коробка-переменная'],['「변의 수」 상자에 4를 담고, 그 수만큼 반복해서 네모 방어막을 만들어 봐. 한 변의 길이는 100이야.','把4放进「边数」盒子，然后重复这么多次，建一个正方形护盾。每条边长100。','Положи 4 в коробку «число сторон» и повтори столько раз, чтобы построить квадратный щит. Сторона — 100.'],
['변수는 숫자를 담아 두는 상자야. 「변의 수」 블록을 끌어서 반복하기의 숫자 칸 위에 놓아.','变量是存放数字的盒子。把「边数」积木拖到重复积木的数字格上。','Переменная — это коробка, в которой хранится число. Перетащи блок «число сторон» на поле с числом в блоке повторения.'],
['육각형 방어막','六边形护盾','Шестиугольный щит'],['육각형 방어막을 만들어. 「변의 수」 상자에 6을 담아. 도는 각도는 숫자로 쓰지 말고 「360 ÷ 변의 수」로 계산하게 해. 한 변의 길이는 60이야.','做一个六边形护盾。把6放进「边数」盒子。转的角度不要直接写数字，让它用「360 ÷ 边数」来计算。每条边长60。','Построй шестиугольный щит. Положи 6 в коробку «число сторон». Не пиши угол числом — пусть он считается как «360 ÷ число сторон». Длина стороны — 60.'],

function newState(z){const s={x:0,y:0,h:z.h||0,segs:[],trail:[],said:[],ans:null,vr:null,steps:0,err:null,turn:null,cond:null,boom:0};

const fmt=v=>+(Math.round(v*10)/10);
function val(v,st){
 if(typeof v==='number')return v;
 if(v.v==='ans'){if(st.ans==null){st.err=['아직 대답이 없어. 「묻고 대답 기다리기」가 먼저 와야 해.'];return 0}return st.ans}

 const a=val(v.a,st),b=val(v.b,st);
 if(v.op==='÷'){if(b===0){st.err=['0으로는 나눌 수 없어.'];return 0}return a/b}

function* exec(list,st,z){
 for(const b of list){

  const a=b.args;

   if(!g){st.err=['여기는 칸이 없는 우주야. 「이동 방향으로 ~만큼 움직이기」를 써.'];return}
   if(h%45){st.err=['이 우주에서는 45°, 90°, 135°, 180°처럼 돌아야 칸에 맞아. 지금은 {0}°만큼 돌아가 있어.',fmt(h)];return}
   const r=h*Math.PI/180,nx=st.cx+Math.round(Math.cos(r)),ny=st.cy+Math.round(Math.sin(r));
   if(nx<0||ny<0||nx>=g.cols||ny>=g.rows){st.err=['우주 지도 밖으로 나갔어. 방향과 칸 수를 확인해 봐.'];return}
   st.cx=nx;st.cy=ny;[st.x,st.y]=g.pos(nx,ny);st.trail.push([st.x,st.y]);
   if(g.bad.has(nx+','+ny)){st.boom=1;st.err=[g.enemy.has(nx+','+ny)?'적 우주선과 부딪혔어! 다른 방향으로 가야 해.':'적의 레이저에 맞았어! 이 칸에 오기 전에 방향을 바꿔야 했을까, 칸 수가 달랐을까?'];yield {id:b.id};return}
   yield {id:b.id}}
  else if(b.t==='move'){st.turn=null;const n=val(a.n,st);if(st.err)return;const r=st.h*Math.PI/180,x=st.x+Math.cos(r)*n,y=st.y+Math.sin(r)*n;st.segs.push([st.x,st.y,x,y]);st.x=x;st.y=y;yield {id:b.id}}
  else if(b.t==='right'||b.t==='left'){const d=val(a.a,st);if(st.err)return;const s=b.t==='right'?d:-d;st.turn={from:st.h,d:s};st.h+=s;yield {id:b.id,note:[b.t==='right'?'오른쪽으로 {0}° 돌았어.':'왼쪽으로 {0}° 돌았어.',fmt(d)]}}

   st.cond=[ex,ok];
   yield {id:b.id,flow:1,slow:1,note:[ok?'「{0}」은 <b>참</b>(맞다) → 위 칸을 실행해.':b.t==='if'?'「{0}」은 <b>거짓</b>(아니다) → 건너뛰어.':'「{0}」은 <b>거짓</b>(아니다) → 「아니면」 아래 칸을 실행해.',ex]};

  else if(b.t==='setvar'){st.turn=null;const v=val(a.v,st);if(st.err)return;st.vr=v;yield {id:b.id,note:['「변의 수」 상자에 {0}을(를) 담았어.',fmt(v)]}}

  ${L('flow','만일 <span class="cond">'+v+'<span class="op">&lt;</span>'+s(3)+'</span> (이)라면')}
  ${L('look',s('그릴 수 없어요')+' 을(를) 말하기',1)}

 </section>
 <section class="panel"><h3>${ti('여기 블록 → 엔트리에서 찾는 곳')}</h3>

  <tr><td>왼쪽으로 90° 돌기</td><td>방향을 270° 만큼 회전하기</td><td>움직임</td></tr>
  <tr><td>이동 방향으로 ~ 움직이기</td><td>같음</td><td>움직임</td></tr>
  <tr><td>~번 반복하기, 만일 ~ 아니면</td><td>같음</td><td>흐름</td></tr>

 </section></div>`;
}

/* ───────── 끌어 놓기 ───────── */
let drag=null,ghost=null,marker=null,justDragged=false;
function clearMarks(){marker?.remove();marker=null;document.querySelectorAll('.slot.hot').forEach(s=>s.classList.remove('hot'))}
document.addEventListener('pointerdown',e=>{
 if(running||e.button>0||!$('ws'))return;if(e.target.closest('input,select,button'))return;
 const pal=e.target.closest('.pal [data-new],.pal [data-rep]'),bh=e.target.closest('#ws .bh');
 const src=pal||(bh&&bh.parentElement);if(!src)return;
 drag={src,x:e.clientX,y:e.clientY,on:false,kind:pal?(pal.dataset.rep?'rep':'new'):'mv',id:pal?null:Number(src.dataset.id),type:pal?(pal.dataset.new||pal.dataset.rep):null};
});
document.addEventListener('pointermove',e=>{
 if(!drag)return;
 if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7)return;drag.on=true;const el=drag.kind==='new'?drag.src.firstElementChild:drag.src,r=el.getBoundingClientRect();ghost=el.cloneNode(true);ghost.classList.add('dghost');drag.dx=Math.max(0,Math.min(drag.x-r.left,60));drag.dy=Math.max(0,Math.min(drag.y-r.top,30));document.body.appendChild(ghost);if(drag.kind==='mv')drag.src.style.opacity=.35}
 e.preventDefault();ghost.style.left=(e.clientX-drag.dx)+'px';ghost.style.top=(e.clientY-drag.dy)+'px';locate(e.clientX,e.clientY);
},{passive:false});
function locate(mx,my){
 clearMarks();drag.drop=null;const under=document.elementFromPoint(mx,my);drag.inside=!!(under&&under.closest('#ws'));
 if(drag.kind==='rep'){let s=under&&under.closest('#ws .slot:not(.txt)');if(!s){let best=44;document.querySelectorAll('#ws .slot.num').forEach(e=>{const r=e.getBoundingClientRect(),d=Math.hypot(Math.max(r.left-mx,0,mx-r.right),Math.max(r.top-my,0,my-r.bottom));if(d<best){best=d;s=e}})}if(!s)return;if(drag.type==='calc'&&s.parentElement.closest('.r-calc'))return;s.classList.add('hot');drag.drop={slot:s};return}
 /* 명령 블록: 끌고 있는 블록의 왼쪽 위 모서리가 가리키는 곳에 놓는다 */
 const g=ghost.getBoundingClientRect(),x=g.left+12,y=g.top+9,el=document.elementFromPoint(x,y);
 const mine=n=>drag.kind==='mv'&&n.closest(`.blk[data-id="${drag.id}"]`);
 let list=null,i=-1;
 if(el&&el.closest('#ws')){
  const bar=el.closest('.bh,.bm,.bf'),c=bar&&bar.parentElement;
  if(bar&&c.classList.contains('cblk')&&!mine(c)){
   const r=bar.getBoundingClientRect(),lists=[...c.children].filter(k=>k.classList.contains('list'));
   if(bar.classList.contains('bh')&&y>r.top+r.height*.45){list=lists[0];i=0}
   else if(bar.classList.contains('bm')){if(y>r.top+r.height*.45){list=lists[1];i=0}else{list=lists[0];i=1e9}}
   else if(bar.classList.contains('bf')&&y<r.top+r.height*.5){list=lists[lists.length-1];i=1e9}
  }
  if(!list)list=el.closest('#ws .list');
 }
 if(!list){if(!drag.inside)return;list=$('ws').querySelector('.list.root')}
 if(mine(list))return;
 const kids=[...list.children].filter(k=>k.classList.contains('blk')&&Number(k.dataset.id)!==drag.id);
 if(i<0){i=kids.findIndex(k=>{const r=k.getBoundingClientRect();return y<r.top+Math.min(r.height/2,20)});if(i<0)i=kids.length}
 i=Math.min(i,kids.length);
 marker=document.createElement('div');marker.className='marker';list.insertBefore(marker,kids[i]||null);drag.drop={key:list.dataset.list,i};
}
function endDrag(e){
 if(!drag)return;const d=drag;drag=null;
 if(!d.on){if(d.kind==='new'&&e.type==='pointerup')addBlock(d.type,'root',program.length);else if(d.kind==='rep'&&e.type==='pointerup')status(t('둥근 값 블록은 끌어서 흰 숫자 칸 위에 놓아 줘.'));return}
 ghost?.remove();ghost=null;d.src.style.opacity='';clearMarks();justDragged=true;setTimeout(()=>justDragged=false,0);
 if(e.type!=='pointerup')return;
 if(d.kind==='rep'){if(!d.drop)return;const s=d.drop.slot,f=find(Number(s.dataset.bid));if(!f)return;remember();const [o,k]=ref(f.b.args,s.dataset.path);o[k]=d.type==='ans'?{v:'ans'}:d.type==='var'?{v:'var'}:{v:'calc',a:10,op:'÷',b:10};changed();return}
 if(d.kind==='new'){if(d.drop)addBlock(d.type,d.drop.key,d.drop.i);return}
 if(!d.drop){if(!d.inside){remember();const f=find(d.id);f.list.splice(f.i,1);changed()}return}
 remember();const f=find(d.id);f.list.splice(f.i,1);const L=getList(d.drop.key);L.splice(Math.min(d.drop.i,L.length),0,f.b);changed();
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
function addBlock(k,key,i){
 if(running)return;if(count(program)>=m().max){status(t('블록 칸이 가득 찼어. 반복으로 묶거나 필요 없는 블록을 지워 봐.'),'bad');return}
 const L=getList(key);if(!L)return;remember();L.splice(Math.min(i,L.length),0,make(k));changed();
}
document.addEventListener('click',e=>{
 if(running||justDragged||!e.target.closest('#ws'))return;
 const del=e.target.closest('[data-del]');
 if(del){const f=find(Number(del.dataset.del));if(f){remember();f.list.splice(f.i,1);changed()}return}
 if(e.target.closest('select,input'))return;
 const s=e.target.closest('.slot');if(!s)return;
 if(s.classList.contains('num')||s.classList.contains('txt')){editSlot(s);return}
 const f=find(Number(s.dataset.bid));if(!f)return;remember();const [o,k]=ref(f.b.args,s.dataset.path);o[k]=10;changed();
});
document.addEventListener('change',e=>{
 const s=e.target.closest('#ws select');if(!s||running)return;const f=find(Number(s.dataset.bid));if(!f)return;remember();const [o,k]=ref(f.b.args,s.dataset.path);o[k]=s.value;changed();
});
function editSlot(s){
 const f=find(Number(s.dataset.bid));if(!f)return;const isT=s.classList.contains('txt'),[o,k]=ref(f.b.args,s.dataset.path);
 const inp=document.createElement('input');inp.className='edit';inp.type=isT?'text':'number';inp.value=o[k];if(isT)inp.maxLength=16;s.replaceChildren(inp);inp.focus();inp.select();
 let fin=false;const done=()=>{if(fin)return;fin=true;let v=inp.value;if(isT)v=v.trim()||o[k];else{v=inp.value===''?o[k]:Number(v);if(!Number.isFinite(v))v=o[k];v=Math.max(-999,Math.min(999,Math.round(v*10)/10))}if(v!==o[k]){remember();o[k]=v}changed()};
 inp.onblur=done;inp.onkeydown=e=>{if(e.key==='Enter')inp.blur()};
}
persist();home();
</script>
</body>
</html>
